# SPDX-License-Identifier: MIT OR GPL-2.0-only
name: CI

on:
  push:
    branches: [main]
  pull_request:

# A new push to a PR makes the previous run obsolete. Runs on main are never cancelled.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

env:
  KERNEL_COMMIT: 986c24e0fe44f844b44d365b71ce831947f50298

# The default shell has no pipefail, which would hide a failing test behind `tee`.
defaults:
  run:
    shell: bash

jobs:
  format:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: '3.13'
      # Pinned from pip, because the runner's apt has a different clang-format, and two versions
      # never agree on every line.
      - run: pip install clang-format==21.1.8
      - run: clang-format --dry-run --Werror $(git ls-files '*.cpp' '*.h' '*.c')

  test:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - {name: gcc-debug-sanitize, os: ubuntu-latest, cxx: g++, build_type: Debug, sanitize: 'ON', page_bits: 12}
          - {name: clang-release, os: ubuntu-latest, cxx: clang++, build_type: Release, sanitize: 'OFF', page_bits: 12}
          # arm64 like the phones: the codecs there, and the harness's cycle counter, which uses the PMU only on arm64.
          - {name: gcc-release-arm64, os: ubuntu-24.04-arm, cxx: g++, build_type: Release, sanitize: 'OFF', page_bits: 12}
          # seqlz for 16 KiB pages. Without the kernel codecs: zram's calls into them are built for 4 KiB pages.
          - {name: gcc-16k-sanitize, os: ubuntu-latest, cxx: g++, build_type: Release, sanitize: 'ON', page_bits: 14}
    name: test (${{ matrix.name }})
    steps:
      - uses: actions/checkout@v7
      - run: sudo apt-get update && sudo apt-get install -y ninja-build
      # Only the files the kernel codecs need, from the commit docs/plan.md was verified against. About 3s.
      - name: fetch kernel lz4, lzo and zstd sources
        if: matrix.page_bits == 12
        run: |
          git init -q kernel && cd kernel
          git remote add origin https://github.com/torvalds/linux.git
          git sparse-checkout set --no-cone /lib/lz4/ /lib/lzo/ /lib/zstd/ /lib/xxhash.c /include/linux/lz4.h /include/linux/lzo.h /include/linux/zstd.h /include/linux/zstd_lib.h /include/linux/zstd_errors.h /include/linux/xxhash.h
          git fetch -q --depth 1 --filter=blob:none origin ${{ env.KERNEL_COMMIT }}
          git checkout -q FETCH_HEAD
      - run: >
          cmake -S . -B build -G Ninja
          -DQUETSCHN_KERNEL_TREE=${{ matrix.page_bits == 12 && format('{0}/kernel', github.workspace) || '' }}
          -DQUETSCHN_PAGE_BITS=${{ matrix.page_bits }}
          -DCMAKE_CXX_COMPILER=${{ matrix.cxx }}
          -DCMAKE_BUILD_TYPE=${{ matrix.build_type }}
          -DQUETSCHN_WERROR=ON
          -DQUETSCHN_SANITIZE=${{ matrix.sanitize }}
      - run: cmake --build build
      # On arm64 the harness counts cycles with the PMU, and perf_event_open needs this.
      - if: runner.arch == 'ARM64'
        run: sudo sysctl -w kernel.perf_event_paranoid=2
      # A binary that ran no test at all also exits 0, so check that doctest ran assertions.
      - run: ./build/quetschn_test | tee test.log
      - run: |
          grep -E 'assertions: +[1-9][0-9]* \| +[1-9][0-9]* passed \| +0 failed' test.log

  # The decoder on any input and the roundtrip of any page, a minute each, at the same time, with ASan
  # and UBSan. The long runs are fuzz/afl.sh. An input that fails is kept as an artifact.
  fuzz:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - run: fuzz/smoke.sh 60 build-fuzz
      - if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: fuzz-crashes
          path: build-fuzz/crashes

  # The same compressed bytes on every CPU, and every page decodes again: on big-endian s390x under
  # qemu, on 32-bit x86, which the kernel's build bots build too, and with the decoder's loop for in-order
  # cores, as on x86-64. Plain C, so that it builds in seconds under qemu.
  same-bytes:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: docker/setup-qemu-action@v3
        with:
          platforms: s390x
      - run: sudo apt-get update && sudo apt-get install -y gcc-multilib
      - run: |
          src="test/seqlz_endian.c src/seqlz.c src/seqlz_default_tables.c src/seqlz_lit_sets.c"
          gcc -O2 -Isrc -o le $src && ./le | tee le.txt
          gcc -m32 -O2 -Isrc -o le32 $src && ./le32 | tee le32.txt
          # the decoder's loop for in-order cores, which only arm64 kernels pick at run time
          gcc -O2 -DSEQLZ_IN_ORDER=1 -Isrc -o lei $src && ./lei | tee lei.txt
          docker run --rm --platform linux/s390x -v "$PWD:/w" -w /w gcc:14 sh -c "gcc -O2 -Isrc -o be $src && ./be" | tee be.txt
          diff le.txt le32.txt
          diff le.txt lei.txt
          diff le.txt be.txt

  # The docs against the code: the tables' hashes in docs/format.md, and pages compressed by src/
  # decoded by the decoder written from docs/format.md alone. And every relative link and #anchor in
  # the Markdown files, which a renamed heading breaks without anything else failing.
  docs:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - run: tools/seqlz-ref/check.sh
      - run: tools/check-links.py

  # The one required check. A job whose dependency failed is skipped, and a skipped required check
  # counts as passed, so this needs if: always() and has to look at every result itself.
  ci-ok:
    if: always()
    needs: [format, test, fuzz, same-bytes, docs]
    runs-on: ubuntu-latest
    steps:
      - run: |
          test "${{ needs.format.result }}" = success
          test "${{ needs.test.result }}" = success
          test "${{ needs.fuzz.result }}" = success
          test "${{ needs.same-bytes.result }}" = success
          test "${{ needs.docs.result }}" = success
